[versions]
agp = "9.6.0-alpha01"
kotlin = "2.5.0-Beta2"
composeBom = "2026.10.01"
activity = "1.14.0-alpha03"
lifecycle = "2.12.0-alpha05"
camerax = "1.7.0-rc01"
coreKtx = "1.19.1"
graphicsShapes = "1.1.0"
coroutines = "1.11.0"
zxingCpp = "3.1.1"
wechatQrcode = "2.6.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
compose-bom = { module = "androidx.compose:compose-bom-alpha", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
zxing-cpp = { module = "io.github.zxing-cpp:android", version.ref = "zxingCpp" }
wechat-opencv = { module = "com.github.jenly1314.WeChatQRCode:opencv", version.ref = "wechatQrcode" }
wechat-opencv-arm64 = { module = "com.github.jenly1314.WeChatQRCode:opencv-armv64", version.ref = "wechatQrcode" }
wechat-qrcode = { module = "com.github.jenly1314.WeChatQRCode:wechat-qrcode", version.ref = "wechatQrcode" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
